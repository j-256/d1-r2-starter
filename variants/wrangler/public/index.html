<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>D1 + R2 Document Library</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { align-items: center; background: #f4f3ef; color: #18221d; display: flex; justify-content: center; margin: 0; min-height: 100vh; }
    main { max-width: 45rem; padding: 3rem 1.5rem; }
    .eyebrow { color: #1f6b45; font-family: ui-monospace, monospace; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    h1 { font-size: clamp(2.6rem, 8vw, 4.5rem); letter-spacing: -0.05em; line-height: 1; margin: 1.1rem 0 1.5rem; }
    p { color: #67716b; font-size: 1.1rem; line-height: 1.7; }
    code { background: white; border: 1px solid #dfe3dc; border-radius: 0.5rem; display: block; margin-top: 0.5rem; padding: 0.65rem 0.75rem; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Shared feature API ready</p>
    <h1>D1 + R2 Document Library</h1>
    <p>The data-model-neutral platform shell runs a document feature that stores structured metadata in D1 and binary content in R2.</p>
    <code>GET /api/documents</code>
    <code>POST /api/documents</code>
    <code>GET /api/documents/:id</code>
    <code>DELETE /api/documents/:id</code>
  </main>
</body>
</html>
